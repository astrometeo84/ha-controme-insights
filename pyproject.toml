# Not a Python package: this file only lets uv manage the tools for tests and linting.
# The integration version lives in custom_components/controme_insights/manifest.json.

[project]
name = "ha-controme-insights"
version = "0"
requires-python = ">=3.14.2"
dependencies = []

[project.optional-dependencies]
dev = [
  # Keep in sync with "requirements" in manifest.json.
  "aiocontrome>=0.1.0",
  # Pins Home Assistant; 0.13.375 = HA 2026.10.4 (no release for 2026.11 yet).
  "pytest-homeassistant-custom-component==0.13.375",
  "ruff",
  "mypy",
]

[tool.uv]
package = false

[tool.uv.sources]
# Development against the local library checkout; remove before a release (PyPI version).
aiocontrome = { path = "../aiocontrome", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=custom_components.controme_insights --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
