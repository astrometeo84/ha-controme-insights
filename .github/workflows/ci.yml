name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every job runs in the environment "ci". It has a protection rule "Required reviewers"
# (the maintainer), so each run waits until the maintainer approves it under
# "Review deployments". Create the environment with that rule BEFORE adding this file:
# a missing environment is created automatically without protection.

jobs:
  checks:
    name: Checks (Python 3.14)
    environment: ci
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # uv pinned like in aiocontrome; raise it together with the local uv.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.13.8"
          python-version: "3.14"
      # pyproject.toml points aiocontrome to the local checkout ../aiocontrome
      # ([tool.uv.sources]), which does not exist here. --no-sources ignores that and installs
      # aiocontrome from PyPI, i.e. the version users get via manifest.json. Without --locked,
      # because uv.lock was resolved against the local path.
      - run: uv sync --no-sources --all-extras
      # --no-sync: otherwise `uv run` would sync again with the local path source.
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy custom_components
      - run: uv run --no-sync pytest

  hassfest:
    name: hassfest
    environment: ci
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    environment: ci
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # No entry in home-assistant/brands yet; remove once the logo is submitted.
          ignore: brands
